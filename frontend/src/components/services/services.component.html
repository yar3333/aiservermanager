<mat-card class="services-card">
  <mat-card-content>
    <div class="section-header">
      <h2>Services</h2>
      <button mat-raised-button color="primary" (click)="addService()">
        <span class="material-icons" style="font-size: 18px; margin-right: 4px">add</span>
        Add Llama
      </button>
    </div>

    @if (unified().length > 0) {
      <div class="services-list">
        @for (svc of unified(); track svc.name) {
          <mat-card class="service-item" [class.llama]="svc.isLlama">
            <mat-card-content>
              <div class="service-header">
                <span class="service-name">{{ svc.name }}</span>
                <div class="service-controls">
                  <div class="service-actions">
                    <button
                      mat-raised-button
                      color="primary"
                      [disabled]="svc.running"
                      (click)="control(svc.name, 'start')"
                    >
                      <span class="material-icons" style="font-size: 18px; margin-right: 4px">play_arrow</span>
                      Start
                    </button>
                    <button
                      mat-raised-button
                      color="warn"
                      [disabled]="!svc.running"
                      (click)="control(svc.name, 'stop')"
                    >
                      <span class="material-icons" style="font-size: 18px; margin-right: 4px">stop</span>
                      Stop
                    </button>
                    <button mat-stroked-button [disabled]="!svc.enabled" (click)="control(svc.name, 'disable')">
                      <span class="material-icons" style="font-size: 18px; margin-right: 4px">lock</span>
                      Disable
                    </button>
                    <button mat-stroked-button [disabled]="svc.enabled" (click)="control(svc.name, 'enable')">
                      <span class="material-icons" style="font-size: 18px; margin-right: 4px">lock_open</span>
                      Enable
                    </button>
                  </div>
                  <div [style.visibility]="svc.isLlama ? 'display' : 'hidden'" class="service-actions">
                    <button mat-icon-button color="primary" (click)="editService(svc)">
                      <span class="material-icons">edit</span>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteService(svc.suffix)">
                      <span class="material-icons">delete</span>
                    </button>
                  </div>
                </div>
              </div>

              @if (svc.error) {
                <div class="service-error">{{ svc.error }}</div>
              }
            </mat-card-content>
          </mat-card>
        }
      </div>
    } @else if (!loading()) {
      <div class="empty">
        <p>No services yet. Click "Add Llama" to create one.</p>
      </div>
    }
  </mat-card-content>
</mat-card>

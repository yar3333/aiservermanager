<h2 mat-dialog-title>Password of {{ user }}</h2>

<mat-dialog-content>
  <p class="dialog-description">
    Service <strong>{{ service }}</strong> is registered to run as <strong>{{ user }}</strong>, and the
    Windows service manager logs that account on with its password. It keeps its own protected copy, so
    nothing you type here is saved — the next reinstall or edit asks for it again.
  </p>

  <mat-form-field appearance="outline" class="full-width">
    <input
      matInput
      type="password"
      name="accountPassword"
      [(ngModel)]="password"
      (keyup.enter)="submit()"
      autocomplete="new-password"
      autofocus
    />
    <mat-label>Password</mat-label>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="!password">Continue</button>
</mat-dialog-actions>

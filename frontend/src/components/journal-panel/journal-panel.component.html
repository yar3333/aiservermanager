<mat-card class="journal-card">
  <mat-card-content>
    <div class="journal-header">
      <h2>Journal</h2>
      @if (!loading() && services().length > 0) {
        <mat-select
          [ngModel]="selectedService()"
          (ngModelChange)="onServiceChange($event)"
          class="service-select"
          disableOptionCentering
        >
          <mat-option [value]="null">— None —</mat-option>
          @for (svc of services(); track svc.name) {
            <mat-option [value]="svc.name">{{ svc.name }}</mat-option>
          }
        </mat-select>

        @if (wordWrap()) {
          <button mat-flat-button color="primary" (click)="toggleWordWrap()" aria-label="Disable word wrap">
            <mat-icon>wrap_text</mat-icon>
          </button>
        } @else {
          <button mat-stroked-button (click)="toggleWordWrap()" aria-label="Enable word wrap">
            <mat-icon>wrap_text</mat-icon>
          </button>
        }
      }
    </div>

    @if (error()) {
      <div class="journal-error">{{ error() }}</div>
    }

    @if (selectedService()) {
      <div #journalBody class="journal-body">
        <pre [class.wrap-on]="wordWrap()">{{ journalText() }}</pre>
      </div>
    } @else {
      <div class="journal-body journal-empty">
        <p>No service selected</p>
      </div>
    }
  </mat-card-content>
</mat-card>

<mat-toolbar color="primary">
  <span class="material-icons" style="margin-right: 8px">monitoring</span>
  <span>AI Server Manager</span>
  <span class="spacer"></span>
  <span class="mat-body-2">GPU Dashboard</span>
</mat-toolbar>

@if (loading()) {
  <mat-progress-bar mode="query" color="primary"></mat-progress-bar>
}

<div class="container">
  @if (error()) {
    <mat-card class="error-card">
      <mat-card-content>
        <span class="material-icons" style="color: #f44336; font-size: 48px; float: left; margin-right: 16px">
          error_outline
        </span>
        <p>{{ error() }}</p>
        <p class="mat-body-2" style="color: #999">Make sure the backend is running on port 4242.</p>
      </mat-card-content>
    </mat-card>
  } @else {
    @if (!hasGpus()) {
      <mat-card class="empty-card">
        <mat-card-content>
          <p>No GPUs detected.</p>
          <p class="mat-body-2" style="color: #999">Ensure nvidia-smi or rocm-smi is available on this system.</p>
        </mat-card-content>
      </mat-card>
    } @else {
      <app-gpu-table [gpus]="gpus()" />
    }

    <app-services />
  }
</div>

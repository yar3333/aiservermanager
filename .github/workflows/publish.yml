name: Build and Publish to npm

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A push with a tag triggers this workflow twice (branch push + tag push on the
# same commit); keep only the tag run, which also publishes.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Build
        run: npm run build

      - name: Package npm release
        run: node scripts/package-npm.mjs

      - name: Upload npm release artifact
        uses: actions/upload-artifact@v5
        with:
          name: npm-release
          path: release/aiservermanager

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    environment: NPM

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download npm release artifact
        uses: actions/download-artifact@v6
        with:
          name: npm-release
          path: release/aiservermanager

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Dry-run pack (sanity check)
        working-directory: release/aiservermanager
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing)
        working-directory: release/aiservermanager
        run: npm publish --access public --provenance
